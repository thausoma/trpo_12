name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make gfortran

    - name: Build OpenBLAS
      run: |
        # Собираем OpenBLAS один раз для всего проекта
        cd OpenBLAS
        make NO_SHARED=1 ONLY_CBLAS=1 NOFORTRAN=1
    
    - name: Run TestBlas
      run: |
        # Переходим в папку с тестами
        cd TrpoTest/TestBlas
        # Теперь OpenBLAS уже скомпилирован в ../OpenBLAS/
        make all
        ./tests/main_test
    
    - name: Test performance
      run: |
        # Переходим в папку с лабой
        cd cblas_6lab
        # Компилируем, указывая пути к уже собранному OpenBLAS
        # -I../OpenBLAS для cblas.h, -L../OpenBLAS для libopenblas.a
        g++ main.cpp -o main -I../OpenBLAS -L../OpenBLAS -lopenblas -lpthread -lm
        ./main