name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make gfortran cmake

    - name: Build OpenBLAS
      run: |
        cd OpenBLAS
        # 1. Радикальная очистка всех сгенерированных файлов
        # Это удалит все ссылки на твои локальные пути (типа /home/kirill/...)
        make distclean || true
        
        # 2. Очистка остатков CMake
        rm -f CMakeCache.txt
        rm -rf CMakeFiles
        
        # 3. Сборка заново
        make NO_SHARED=1 ONLY_CBLAS=1 NOFORTRAN=1 -j$(nproc)

    - name: Run TestBlas
      run: |
        cd TrpoTest/TestBlas
        # Здесь make автоматически подхватит библиотеку из ../OpenBLAS
        make all
        ./tests/main_test

    - name: Test performance
      run: |
        cd cblas_6lab
        # Компиляция с учетом того, что OpenBLAS лежит в ../OpenBLAS
        g++ main.cpp -o main \
          -I../OpenBLAS \
          -L../OpenBLAS \
          -lopenblas -lpthread -lm
        ./main