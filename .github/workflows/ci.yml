name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install compilers
      run: sudo apt-get install -y g++ make gfortran
    
    - name: Debug directory structure
      run: |
        echo "Current directory:"
        pwd
        echo "Content of current directory:"
        ls -R
        echo "Content of OpenBLAS directory:"
        ls -la OpenBLAS || echo "OpenBLAS directory does not exist or is inaccessible"

    - name: Build OpenBLAS
      run: |
        cd OpenBLAS
        chmod +x c_check f_check || true
        make NO_SHARED=1 ONLY_CBLAS=1 NOFORTRAN=1
        cd ..
    
    - name: Test BLAS functions
      run: |
        cd TrpoTest/TestBlas
        make all
        chmod +x tests/main_test
        make run
    
    - name: Test performance
      run: |
        cd cblas_6lab
        g++ main.cpp -o main
        chmod +x main
        ./main