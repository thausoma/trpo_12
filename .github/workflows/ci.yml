name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make gfortran

    - name: Diagnose file structure
      run: |
        pwd
        ls -F
        ls -la OpenBLAS/
        if [ -f "OpenBLAS/Makefile" ]; then
        else
          echo "ФАЙЛА MAKEFILE НЕТ В ПАПКЕ OpenBLAS"
        fi
    
    - name: Run TestBlas
      run: |
        cd TrpoTest/TestBlas
        # Вызываем make, но теперь он увидит, что libopenblas.a уже есть
        make all
        ./tests/main_test
    
    - name: Test performance
      run: |
        cd cblas_6lab
        # -I../OpenBLAS позволяет находить cblas.h, -L../OpenBLAS указывает на libopenblas.a
        g++ main.cpp -o main -I../OpenBLAS -L../OpenBLAS -lopenblas -lpthread -lm
        ./main