name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make gfortran cmake

    - name: Build OpenBLAS
      run: |
        cd OpenBLAS
        # 1. Удаляем все файлы, которые могли сгенерировать локальные пути
        rm -f CMakeCache.txt
        rm -rf CMakeFiles
        rm -f cmake_install.cmake
        rm -f Makefile
        # Удаляем скрытые файлы CMake, если они есть
        find . -name "CMakeCache.txt" -type f -delete
        find . -name "CMakeFiles" -type d -exec rm -rf {} +
        
        # 2. Пытаемся собрать. Если Makefile был удален, make выдаст ошибку,
        # но мы создадим его заново с помощью команды конфигурации.
        # Если OpenBLAS требует предварительной настройки, используем:
        if [ ! -f Makefile ]; then
            echo "Makefile отсутствует, генерируем через cmake..."
            cmake . -DNO_SHARED=1 -DONLY_CBLAS=1 -DNOFORTRAN=1
        fi
        
        make NO_SHARED=1 ONLY_CBLAS=1 NOFORTRAN=1 -j$(nproc)

    - name: Run TestBlas
      run: |
        cd TrpoTest/TestBlas
        # Здесь make автоматически подхватит библиотеку из ../OpenBLAS
        make all
        ./tests/main_test

    - name: Test performance
      run: |
        cd cblas_6lab
        # Компиляция с учетом того, что OpenBLAS лежит в ../OpenBLAS
        g++ main.cpp -o main \
          -I../OpenBLAS \
          -L../OpenBLAS \
          -lopenblas -lpthread -lm
        ./main