name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install compilers
      run: sudo apt-get update && sudo apt-get install -y g++ make gfortran
    
    - name: Run Tests
      run: |
        # Собираем всё через твой Makefile
        cd TrpoTest/TestBlas
        make run
    
    - name: Test performance
      run: |
        cd cblas_6lab
        # Важно: здесь тоже нужны флаги линковки с OpenBLAS
        # Предполагаем, что main.cpp использует заголовки из папки OpenBLAS
        g++ main.cpp -o main -I../OpenBLAS -L../OpenBLAS -lopenblas -lpthread -lm
        ./main