name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make gfortran cmake

    - name: Build OpenBLAS
      run: |
        cd OpenBLAS
        # ... (очистка остается прежней)
        
        # Сборка
        if [ ! -f Makefile ]; then
            cmake . -DNO_SHARED=1 -DONLY_CBLAS=1 -DNOFORTRAN=1
        fi
        make NO_SHARED=1 ONLY_CBLAS=1 NOFORTRAN=1 -j$(nproc)
        
        # ИЩЕМ библиотеку и копируем её в корень OpenBLAS, чтобы другие шаги её видели
        find . -name "libopenblas.a" -exec cp {} . \;
        
        # Проверка
        ls -la libopenblas.a || (echo "libopenblas.a не найден!" && exit 1)

    - name: Run TestBlas
      run: |
        # Создаем симлинк, чтобы Makefile в TestBlas нашел OpenBLAS
        # Теперь папка ../OpenBLAS внутри TrpoTest будет указывать на корень
        ln -s ../../OpenBLAS TrpoTest/OpenBLAS
        
        cd TrpoTest/TestBlas
        make all
        ./tests/main_test

    - name: Test performance
      run: |
        cd cblas_6lab
        # Компиляция с явным указанием путей к корню проекта
        g++ main.cpp -o main \
          -I../OpenBLAS \
          -L../OpenBLAS \
          -lopenblas -lpthread -lm
        ./main