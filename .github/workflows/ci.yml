name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make gfortran cmake

    - name: Build OpenBLAS
      run: |
        cd OpenBLAS
        # 1. УБИВАЕМ ВСЁ, что связано с предыдущими попытками сборки
        rm -rf CMakeCache.txt CMakeFiles cmake_install.cmake Makefile
        
        # 2. Удаляем файлы, которые могли закэшировать локальные пути
        # Используем find, чтобы найти и убить все скрытые файлы CMake
        find . -type f -name "CMakeCache.txt" -delete
        find . -type d -name "CMakeFiles" -exec rm -rf {} +
        
        # 3. Принудительная генерация БЕЗ использования старого Makefile
        # Мы используем cmake для генерации чистого Makefile с путями сервера
        cmake . -DNO_SHARED=1 -DONLY_CBLAS=1 -DNOFORTRAN=1
        
        # 4. Сборка
        make NO_SHARED=1 ONLY_CBLAS=1 NOFORTRAN=1 -j$(nproc)
        
        # 5. Копируем библиотеку в корень
        find . -name "libopenblas.a" -exec cp {} . \;
        
        # 6. Проверка
        ls -la libopenblas.a || (echo "libopenblas.a не найден!" && exit 1)

    - name: Run TestBlas
      run: |
        # 1. Создаем папку OpenBLAS там, где её ожидает увидеть Makefile (внутри TrpoTest)
        mkdir -p TrpoTest/OpenBLAS
        
        # 2. Копируем туда заголовочные файлы и саму библиотеку
        # Это "обманет" Makefile, который ищет всё внутри ../OpenBLAS
        cp OpenBLAS/libopenblas.a TrpoTest/OpenBLAS/
        cp OpenBLAS/*.h TrpoTest/OpenBLAS/
        
        # 3. Теперь заходим в папку и запускаем
        cd TrpoTest/TestBlas
        make all
        ./tests/main_test

    - name: Test performance
      run: |
        cd cblas_6lab
        # Компиляция с явным указанием путей к корню проекта
        g++ main.cpp -o main \
          -I../OpenBLAS \
          -L../OpenBLAS \
          -lopenblas -lpthread -lm
        ./main