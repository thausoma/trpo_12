name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make gfortran libopenblas-dev

    - name: Test BLAS functions
      run: |
        cd TrpoTest/TestBlas
        # Предполагаем, что твой Makefile настроен на линковку с -lopenblas
        make all
        chmod +x tests/main_test
        make run
    
    - name: Test performance
      run: |
        cd cblas_6lab
        # Добавляем -lopenblas для линковки с установленной библиотекой
        g++ main.cpp -o main -lopenblas
        ./main