name: CI for blas

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make gfortran

    - name: Build OpenBLAS
      run: |
        cd OpenBLAS
        # Чистый checkout, никаких "make clean" не нужно.
        # Если вдруг в репозитории мусор от старых сборок:
        # git clean -fdx || true
        make NO_SHARED=1 ONLY_CBLAS=1 NOFORTRAN=1 -j$(nproc)
        # Проверим, что статическая библиотека собралась:
        ls -la libopenblas*.a || (echo "libopenblas.a not found!" && exit 1)

    - name: Run TestBlas
      run: |
        cd TrpoTest/TestBlas
        make all
        ./tests/main_test

    - name: Test performance
      run: |
        cd cblas_6lab
        # Путь к заголовкам: ../OpenBLAS (там cblas.h)
        # Путь к библиотеке: ../OpenBLAS (там libopenblas.a)
        g++ main.cpp -o main \
          -I../OpenBLAS \
          -L../OpenBLAS \
          -lopenblas -lpthread -lm
        ./main